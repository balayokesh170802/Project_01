<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D17"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B44F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Æther Monogram -->
  <text x="32" y="44" font-family="'Instrument Serif', Georgia, serif, sans-serif" font-size="34" font-weight="700" fill="#DCE3F0" text-anchor="middle">Æ</text>
</svg>
